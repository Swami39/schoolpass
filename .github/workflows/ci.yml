name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      OTP_DEV_ALLOW: "true"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap Postgres roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -f infra/docker/postgres/init.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d schoolpass -f infra/docker/postgres/init-db.sql
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Typecheck
        run: mypy src/schoolpass
      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://schoolpass_app:app_dev_only@localhost:5432/schoolpass
          DATABASE_URL_MIGRATOR: postgresql+psycopg://schoolpass_migrator:migrator_dev_only@localhost:5432/schoolpass
        run: pytest -q
