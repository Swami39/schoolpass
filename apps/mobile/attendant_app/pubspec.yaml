name: attendant_app
description: SchoolPass bus attendant mobile app (transport NFC outbox).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  nfc_manager: ^4.2.1
  path_provider: ^2.1.4
  http: ^1.2.2
  uuid: ^4.5.1
  attendant_nfc:
    path: ../attendant_nfc
  mobile_push:
    path: ../mobile_push
  schoolpass_design:
    path: ../schoolpass_design

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  uses-material-design: true
